<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDH Media Gallery</title>
    <!-- CSS & FontAwesome Icons -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="dark-mode">

    <!-- Navbar / Header Section -->
    <header class="navbar">
        <div class="logo-area">
            <img src="sazedul2029.png" alt="SDH Logo" class="profile-logo">
            <div class="brand-info">
                <h1>SDH Media Gallery</h1>
                <p>All-in-One Digital Asset Hub</p>
            </div>
        </div>

        <div class="header-tools">
            <!-- Feature 1: Dark/Light Mode Toggle -->
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <div class="main-container">
        <!-- Search & Category Filters Bar -->
        <section class="top-controls">
            <!-- Feature 2: Real-time Search Bar -->
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search media files, titles, tags...">
            </div>

            <!-- Feature 3: Category Filtering -->
            <div class="filter-group">
                <button class="filter-btn active" data-category="all">All Media</button>
                <button class="filter-btn" data-category="photo"><i class="fa-solid fa-image"></i> Photos</button>
                <button class="filter-btn" data-category="video"><i class="fa-solid fa-video"></i> Videos</button>
                <!-- Feature 4: Favorites Filter -->
                <button class="filter-btn" data-category="favorites"><i class="fa-solid fa-heart"></i> Favorites</button>
            </div>
        </section>

        <!-- Media Upload Box -->
        <section class="upload-section">
            <div class="card-header">
                <h3><i class="fa-solid fa-cloud-arrow-up"></i> Upload New Media</h3>
            </div>
            <form id="upload-form" class="upload-form">
                <div class="input-field">
                    <input type="text" id="media-title" placeholder="Enter title or description..." required>
                </div>
                <div class="input-field">
                    <select id="media-category" required>
                        <option value="photo">Photo / Image</option>
                        <option value="video">Video File</option>
                    </select>
                </div>
                <div class="input-field file-input-wrapper">
                    <input type="file" id="media-file" accept="image/*,video/*" required>
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-upload"></i> Upload & Save</button>
            </form>
        </section>

        <!-- Dynamic Media Gallery Grid -->
        <section class="gallery-wrapper">
            <div class="section-title">
                <h2><i class="fa-solid fa-photo-film"></i> Media Assets</h2>
            </div>
            
            <div id="media-grid" class="gallery-grid">
                <!-- Javascript will load items dynamically here -->
            </div>
        </section>
    </div>

    <!-- Feature 5: Lightbox Fullscreen Modal -->
    <div id="lightbox-modal" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <div class="lightbox-body">
            <div id="lightbox-media-container"></div>
            <div class="lightbox-caption">
                <p id="lightbox-caption-text"></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SDH Media Gallery | Designed with Care</p>
    </footer>

    <!-- JS Script Connection -->
    <script src="script.js"></script>
</body>
</html>
